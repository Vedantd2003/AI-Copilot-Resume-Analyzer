services:
  # Type of service to deploy
  type: web
  
  # Name of your service
  name: ai-career-copilot
  
  # Runtime environment
  runtime: node
  
  # Build configuration
  buildCommand: cd server && npm install && cd ../client && npm install && npm run build
  
  # Start command
  startCommand: cd server && npm start
  
  # Environment variables
  envVars:
    # MongoDB connection
    - key: MONGODB_URI
      value: mongodb+srv://abc844023_db_user:XOqo2E3NIMer1Q3b@cluster0.lnbc7l5.mongodb.net/?appName=Cluster0
    # Server configuration
    - key: PORT
      value: 10000
    - key: NODE_ENV
      value: production
    - key: CLIENT_URL
      value: https://ai-copilot-resume-analyzer.onrender.com
    # JWT secrets
    - key: JWT_ACCESS_SECRET
      value: ai_copilot_access_secret_2024_secure_key
    - key: JWT_REFRESH_SECRET
      value: ai_copilot_refresh_secret_2024_secure_key
    # Email configuration (optional - set in Render dashboard if needed)
    - key: EMAIL_USER
      sync: false
    - key: EMAIL_PASS
      sync: false
    # Gemini API key
    - key: GEMINI_API_KEY
      value: AIzaSyBrfG1r3-trZUJciroSsrRV28rhkA4nQJA

# Health check path
healthCheckPath: /api/health

# Auto-deploy configuration
autoDeploy: true

# Plan type
plan: free
