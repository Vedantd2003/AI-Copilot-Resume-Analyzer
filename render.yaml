services:
  # Type of service to deploy
  type: web
  
  # Name of your service
  name: ai-career-copilot
  
  # Use Docker deployment
  env: docker
  
  # Environment variables
  envVars:
    # MongoDB connection (set in Render dashboard)
    - key: MONGODB_URI
      sync: false
    # Server configuration
    - key: PORT
      value: 10000
    - key: NODE_ENV
      value: production
    - key: CLIENT_URL
      value: https://ai-copilot-resume-analyzer.onrender.com
    # JWT secrets (set in Render dashboard)
    - key: JWT_ACCESS_SECRET
      sync: false
    - key: JWT_REFRESH_SECRET
      sync: false
    # Email configuration (set in Render dashboard if needed)
    - key: EMAIL_USER
      sync: false
    - key: EMAIL_PASS
      sync: false
    # Gemini API key (set in Render dashboard)
    - key: GEMINI_API_KEY
      sync: false

# Health check path
healthCheckPath: /api/health

# Auto-deploy configuration
autoDeploy: true

# Plan type
plan: free
